<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>📞 MedCall Filler</h1>

  <!-- Settings view: backend URL + API key -->
  <div id="settings" class="hidden">
    <label>Backend URL</label>
    <input id="backendUrl" placeholder="http://localhost:5000" />
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="your extension API key" />
    <button id="saveSettings">Connect</button>
    <p id="settingsError" class="error"></p>
  </div>

  <!-- Main view: approved drafts -->
  <div id="main" class="hidden">
    <div class="row">
      <span id="connState" class="ok">Connected ✅</span>
      <button id="openSettings" class="link">settings</button>
    </div>
    <input id="search" placeholder="🔍 Search approved drafts (name / phone)…" />
    <div id="draftList"></div>
    <p id="mainError" class="error"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
